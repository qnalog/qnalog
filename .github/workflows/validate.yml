# 纯校验 CI：只验证，不发布。
#
# CI 的真实定义是 package.json 里的 verify:push——本工作流只做「装依赖 + 跑它」，
# 不在这里另维护一份检查清单（否则同一批门禁要同时记在 package.json、
# validate.yml、release.yml 三处，漏改一处就出现两边都绿、但有一项谁都没跑）。
# 以后新增检查只要进入 build / verify，PR CI 与 Release 自动获得，不需要改本文件。
#
# 权限只读、不依赖 repository secret：fork 账号发 PR 同样能跑。
# 发布是另一个工作流（release.yml：tag 触发、contents: write），两者分工不合并。
#
# 注意：workflow 名（Validate）与 job id（validate）是 required status check 绑定的
# check context（Main Protect → Require status checks 选 `validate`）。
# 改名后 GitHub 会继续等待旧 context，PR 永远无法满足规则；
# 该约定由 tests/validate-workflow-contract.test.ts 钉住。
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 用 npm ci 而不是 npm install：package-lock.json 是构建可复现的前提，
      # 「仓库里的 main.js 能由仓库源码逐字节重建」这条约束依赖锁定安装。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # verify:push = lint + build（含静态检查、类型检查、架构门禁、打包、运行时冒烟）
      # + 测试 + 主线隔离 + 旧前缀门禁 + 设置映射表门禁 + 产物一致性（从 HEAD 重建比对）。
      # PR 上检出的是合并引用，因此它比的是「合并结果」是否自洽，而不只是分支自身。
      - name: Verify
        run: npm run verify:push
